# Stack de DESENVOLVIMENTO (ADR-015). Produção usa infra/compose.prod.yml.
# Primeiro uso: scripts/dev-env.sh (gera .env com senhas aleatórias) e depois `docker compose up -d --build`.
name: vv-licitacoes

services:
  postgres:
    build:
      context: ./db
      args: { COM_PGTAP: "1" }
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode scripts/dev-env.sh}
      # Checksums de página (o pgBackRest os valida no backup: detecta corrupção); só vale em volume novo.
      POSTGRES_INITDB_ARGS: --data-checksums
      VV_OWNER_PASSWORD: ${VV_OWNER_PASSWORD:?rode scripts/dev-env.sh}
      VV_API_PASSWORD: ${VV_API_PASSWORD:?rode scripts/dev-env.sh}
      VV_WORKER_PASSWORD: ${VV_WORKER_PASSWORD:?rode scripts/dev-env.sh}
      VV_DB: vv
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/tests:/db/tests:ro
      - ./db/scripts:/db/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vv"]
      interval: 5s
      retries: 20

  # Migrations: `docker compose run --rm dbmate up` (ou `new <nome>`, `rollback`, `status`).
  dbmate:
    image: node:26-bookworm-slim
    profiles: [tools]
    entrypoint: ["npx", "--yes", "dbmate@2.37.0"]
    environment:
      DATABASE_URL: postgres://vv_owner:${VV_OWNER_PASSWORD}@postgres:5432/vv?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_MIGRATIONS_TABLE: dbmate.schema_migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes: ["./db:/db"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./apps/api
    environment:
      NODE_ENV: development
      VV_ENV: dev
      PORT: "3000"
      DATABASE_URL: postgres://vv_api:${VV_API_PASSWORD}@postgres:5432/vv?sslmode=disable
      VV_KEK: ${VV_KEK:?rode scripts/dev-env.sh}
      # Chave PÚBLICA do Web Push (ADR-018); vazia = push desligado.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }

  # Sem porta publicada: o worker não expõe nada fora da rede do compose (ADR-014).
  worker:
    build: ./apps/worker
    environment:
      VV_ENV: dev
      VV_DATABASE_URL: postgresql://vv_worker:${VV_WORKER_PASSWORD}@postgres:5432/vv
      VV_FILA_ATIVA: "true"
      VV_SMTP_HOST: mailpit
      VV_SMTP_PORT: "1025"
      VV_APP_URL: http://localhost:5173
      # Chave PRIVADA do Web Push: só o worker a conhece. Vazia = push desligado.
      VV_VAPID_PRIVATE_KEY: ${VV_VAPID_PRIVATE_KEY:-}
      VV_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }

  # Caixa de e-mail de desenvolvimento: todo e-mail enviado aparece em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]

volumes:
  pgdata:
