# Publica as imagens de produção no GHCR (ADR-015) e marca a versão no git. Só sob demanda (AGENTS.md §0):
# Actions → "Imagens de produção" → Run workflow, informando a versão (ex.: 2026.11.26-1).
# Depois, no servidor: sudo /opt/vv/infra/deploy/deploy.sh <versão>.
name: Imagens de produção

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão (letras, números, ponto, hífen). Vira a tag do git e das imagens."
        required: true

permissions:
  contents: write   # cria a tag do git
  packages: write   # publica no GHCR

concurrency: { group: imagens, cancel-in-progress: false }

jobs:
  imagens:
    runs-on: ubuntu-latest
    env:
      VERSAO: ${{ inputs.versao }}
    steps:
      - name: Versão válida e ainda não usada
        run: |
          case "$VERSAO" in ''|*[!A-Za-z0-9._-]*) echo "versão inválida"; exit 1 ;; esac
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Tag nova
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSAO" >/dev/null; then echo "a tag $VERSAO já existe"; exit 1; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prefixo das imagens
        env: { DONO: "${{ github.repository_owner }}" }
        run: echo "REG=ghcr.io/$(printf '%s' "$DONO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: vv-postgres
        uses: docker/build-push-action@v6
        with: { context: db, push: true, tags: "${{ env.REG }}/vv-postgres:${{ env.VERSAO }}", build-args: "COM_PGTAP=0" }
      - name: vv-migracoes
        uses: docker/build-push-action@v6
        with: { context: db, file: db/Dockerfile.migracoes, push: true, tags: "${{ env.REG }}/vv-migracoes:${{ env.VERSAO }}" }
      - name: vv-api
        uses: docker/build-push-action@v6
        with: { context: apps/api, push: true, tags: "${{ env.REG }}/vv-api:${{ env.VERSAO }}" }
      - name: vv-worker
        uses: docker/build-push-action@v6
        with: { context: apps/worker, push: true, tags: "${{ env.REG }}/vv-worker:${{ env.VERSAO }}" }
      - name: vv-web
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/caddy/Dockerfile, push: true, tags: "${{ env.REG }}/vv-web:${{ env.VERSAO }}" }
      - name: Tag do git
        run: |
          git tag "$VERSAO" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSAO"
