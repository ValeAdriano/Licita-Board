name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardas:
    name: "Guardas (isolamento, hooks, segredos, SAST)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Toda tabela de priv tem teste A x B
        run: python3 scripts/check_isolation_coverage.py
      - name: Testes dos guardas (script de cobertura + hook do Claude Code)
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s .claude/hooks/tests
      - name: Migrations já no main não foram alteradas
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MDR origin/${{ github.base_ref }}...HEAD -- supabase/migrations/ || true)
          if [ -n "$changed" ]; then
            echo "::error::Migration aplicada é imutável. Crie uma nova migration. Alterados: $changed"
            exit 1
          fi
      - name: Gitleaks (segredos)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep (regras VV + registro)
        run: |
          pip install --quiet semgrep
          semgrep scan --metrics=off --error \
            --config .semgrep/ \
            --config p/python --config p/typescript --config p/react --config p/secrets

  web:
    name: "Web (React: lint, typecheck, testes, build PWA, audit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # O bundle é público: nada de segredo, chave-mestra, service role nem source map publicado.
      - run: |
          if grep -rIEl 'VV_KEK|service_role|TURNSTILE_SECRET|VAPID_PRIVATE|sourceMappingURL' dist; then
            echo "bundle com segredo ou source map" >&2; exit 1
          fi
      - run: npm audit --audit-level=high --omit=dev
      # Dependências de build (vite-plugin-pwa -> workbox-build) fora do bundle: só informativo (T7.3).
      - run: npm audit --audit-level=high || true

  api:
    name: "API + banco (stack nova: lint, typecheck, testes, pgTAP, e2e, imagens)"
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Postgres da imagem db/Dockerfile (com pgTAP)
        run: |
          docker build --build-arg COM_PGTAP=1 -t vv-db ./db
          export PGPASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PGPASSWORD"
          echo "PGPASSWORD=$PGPASSWORD" >> "$GITHUB_ENV"
          docker run -d --name vv-db -p 5432:5432 -e POSTGRES_PASSWORD="$PGPASSWORD" \
            -e VV_OWNER_PASSWORD="$(openssl rand -hex 16)" -e VV_API_PASSWORD="$(openssl rand -hex 16)" \
            -e VV_WORKER_PASSWORD="$(openssl rand -hex 16)" vv-db
          for i in $(seq 1 30); do pg_isready -q && break; sleep 1; done
      - name: Migrations (dbmate up, rollback, up) + pgTAP (db/tests)
        run: db/scripts/test-local.sh
      - name: Senha de vv_api para o e2e da API
        run: |
          P="$(openssl rand -hex 16)"
          echo "::add-mask::$P"
          psql -X -q -c "alter role vv_api password '$P'"
          echo "DATABASE_URL_TEST=postgres://vv_api:$P@127.0.0.1:5432/vv_test" >> "$GITHUB_ENV"
          echo "DATABASE_URL_ADMIN_TEST=postgres://postgres:$PGPASSWORD@127.0.0.1:5432/vv_test" >> "$GITHUB_ENV"
      - working-directory: apps/api
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run test:e2e
          npm run build
          npm audit --audit-level=high --omit=dev
      - name: Imagem da API
        run: docker build -t vv-api ./apps/api
      - uses: astral-sh/setup-uv@v6
      - name: Integração do worker com a fila (ops.jobs) no banco de teste
        working-directory: apps/worker
        run: |
          P="$(openssl rand -hex 16)"
          echo "::add-mask::$P"
          psql -X -q -c "alter role vv_worker password '$P'"
          uv sync --locked
          VV_DATABASE_URL_TEST="postgresql://vv_worker:$P@127.0.0.1:5432/vv_test" \
          VV_ADMIN_URL_TEST="postgresql://postgres:$PGPASSWORD@127.0.0.1:5432/vv_test" \
            uv run pytest tests/test_fila.py

  worker:
    name: "Worker (ruff, mypy, pytest, pip-audit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov
      - run: uv run pip-audit --skip-editable

  banco:
    name: "Banco (pgTAP: RLS e isolamento)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Revisão 1 congelada: CLI fixado na 2.x (a 3.0 de 2026-11-02 quebrou o setup com "latest").
      # Este job sai quando o schema da Fase 01 for portado para db/.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: supabase db start (migrations + seed)
        run: |
          set -o pipefail
          supabase db start 2>&1 | tee dbstart.log
      - name: supabase test db
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee pgtap.log
      - name: Publicar falhas do pgTAP como anotações
        if: failure()
        run: |
          cat dbstart.log pgtap.log 2>/dev/null | grep -E "not ok|ERROR|error|Failed test|caught|wanted|Looks like|psql:" | head -40 | while IFS= read -r l; do
            echo "::error title=pgTAP::${l}"
          done

  ci-ok:
    name: ci-ok
    if: always()
    needs: [guardas, web, api, worker, banco]
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs passaram
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::Algum job falhou ou não rodou."
            exit 1
          fi
