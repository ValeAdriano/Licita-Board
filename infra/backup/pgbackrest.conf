# pgBackRest do VV Licitações (ADR-015): WAL contínuo + base cifrados para um bucket S3 EXTERNO.
# Montado em /etc/pgbackrest/pgbackrest.conf (somente leitura) dentro do container do Postgres.
#
# NADA secreto aqui. Os segredos entram por variáveis de ambiente (arquivo 0400 fora do repositório,
# ver README.md): PGBACKREST_REPO1_CIPHER_PASS, PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET,
# PGBACKREST_REPO1_S3_BUCKET, PGBACKREST_REPO1_S3_ENDPOINT, PGBACKREST_REPO1_S3_REGION.
[global]
repo1-type=s3
repo1-path=/vv
repo1-s3-uri-style=path
# Cifra do repositório inteiro (backups e WAL). Perder a senha = perder TODOS os backups: ela fica
# num cofre separado do servidor e do bucket (README.md). aes-256-cbc é o único tipo do pgBackRest e
# NÃO autentica o texto cifrado: os checksums do manifesto (conferidos no restore e no `verify`)
# detectam adulteração, mas não a reversão do repositório a um estado antigo válido; para isso valem
# versionamento e object lock no bucket. A senha precisa de alta entropia (openssl rand -base64 48).
repo1-cipher-type=aes-256-cbc

# Retenção: 5 fulls semanais (~35 dias) com diferenciais por cima; o WAL acompanha. Dado apagado a
# pedido (LGPD) permanece nos backups até expirar: esse prazo é o declarado no inventário LGPD.
repo1-retention-full-type=count
repo1-retention-full=5
repo1-retention-diff=6

compress-type=zst
start-fast=y
process-max=2
# Síncrono: o archive_command só devolve sucesso depois de o WAL estar no bucket. Com archive-async o
# WAL na fila (spool, fora de volume) se perderia na recriação do container, abrindo um buraco no PITR.
archive-async=n
# O servidor NÃO apaga backups: a credencial dele não tem DeleteObject (um invasor do banco não
# consegue destruir os backups). A expiração roda de outra máquina, com outra credencial
# (`pgbackrest --stanza=vv expire`), ou por lifecycle do bucket (README.md).
expire-auto=n
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info

[vv]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
