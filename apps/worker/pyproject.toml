[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["worker"]

[[tool.mypy.overrides]]
module = ["pywebpush", "py_vapid", "magic", "boto3", "botocore", "openpyxl", "openpyxl.*", "pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["worker"]
branch = true

[tool.coverage.report]
show_missing = true
