[project]
name = "vv-worker"
version = "0.0.0"
description = "Worker Python do VV Licitações: PNCP, PDFs, IA, DOCX e jobs agendados."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "python-magic>=0.4.27",
    "pydantic-settings>=2.16.2",
    "pywebpush>=2.5.0",
    "uvicorn>=0.54.0",
    "pypdfium2>=5.14.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "DTZ", "RUF", "PL", "T20"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"scripts/**" = ["T201"]
# SQL em string: quebrar linha só piora a leitura.
"src/worker/pesquisa/repositorio.py" = ["E501"]
"src/worker/pesquisa/coleta.py" = ["E501", "PLR0913", "PLR0917"]
"src/worker/pesquisa/arquivos.py" = ["E501"]
"src/worker/pesquisa/http.py" = ["PLR0913", "PLR0917"]
