# Regras SAST próprias do VV Licitações. Rodam no CI para qualquer agente ou pessoa.
# Cada regra referencia a regra inviolável do AGENTS.md §3.
rules:
  - id: vv-credencial-no-app
    message: >-
      Credencial de banco, S3, chave-mestra ou service role no front (AGENTS.md §3.11, ADR-017). Tudo em
      apps/web vai para o bundle público; o front fala só com a API (VITE_API_URL, por padrão /api).
    severity: ERROR
    languages: [generic]
    pattern-regex: (?i)(service[_-]?role|sb_secret_|vv_(worker|owner|api)\b|VV_\w*PASSWORD|POSTGRES_PASSWORD|DATABASE_URL|S3_SECRET|SECRET_ACCESS_KEY|CHAVE_MESTRA|(?<![a-z])KEK(?![a-z])|TURNSTILE_SECRET|JWT_SECRET|VAPID_PRIVATE|SMTP_PASS\w*|VITE_\w*(SECRET|PASSWORD|PRIVATE|TOKEN))
    paths:
      include: [apps/web/, packages/shared/]
      exclude: ["*.md", "package-lock.json"]

  - id: vv-api-so-vv-api
    message: >-
      Credencial de vv_worker/vv_owner na API (ADR-013). A API conecta só como vv_api, sem BYPASSRLS.
    severity: ERROR
    languages: [generic]
    pattern-regex: (?i)(vv_(worker|owner)\b|VV_(WORKER|OWNER)_PASSWORD|POSTGRES_PASSWORD)
    paths:
      include: [apps/api/]
      exclude: ["*.md", "*.spec.ts", "apps/api/test/", "package-lock.json"]

  - id: vv-api-db-direto
    message: >-
      Injeção direta do Kysely (DB) fora de src/db (ADR-013). Consulta de usuário passa por
      comContexto, para a RLS receber o usuário da sessão. Exceção registrada: src/health.
    severity: ERROR
    languages: [generic]
    pattern-regex: \@Inject\(\s*DB\s*\)
    paths:
      include: [apps/api/src/]
      exclude: [apps/api/src/db/, apps/api/src/health/]

  - id: vv-sessao-fora-do-secure-store
    message: >-
      localStorage/sessionStorage no front (ADR-012, ADR-018). A sessão vive só em cookie HttpOnly: o
      JavaScript nunca guarda token. Se for preferência sem dado sensível, justifique no commit.
    severity: WARNING
    languages: [generic]
    pattern-regex: (localStorage|sessionStorage|indexedDB)
    paths:
      include: [apps/web/src/]

  - id: vv-front-sinks-perigosos
    message: >-
      innerHTML/outerHTML/insertAdjacentHTML/document.write/eval/new Function/document.cookie no front
      (ASVS V5, ADR-018). Texto de terceiro é exibido como texto; o cookie de sessão é HttpOnly e o
      JavaScript nunca o toca.
    severity: ERROR
    languages: [generic]
    pattern-regex: (\.innerHTML|\.outerHTML|insertAdjacentHTML|document\.write|\beval\(|new Function\(|document\.cookie)
    paths:
      include: [apps/web/src/]
      exclude: ["*.test.ts", "*.test.tsx"]

  - id: vv-front-fetch-fora-do-cliente
    message: >-
      fetch/XMLHttpRequest/credentials:'include'/Authorization no front fora de src/api/cliente.ts
      (ADR-018). Toda chamada à API passa pelo cliente único (CSRF, 401, 403 "MFA", fundo).
    severity: ERROR
    languages: [generic]
    pattern-regex: (\bfetch\(|XMLHttpRequest|credentials:\s*['"]include|Authorization)
    paths:
      include: [apps/web/src/]
      exclude: ["*.test.ts", "*.test.tsx", "apps/web/src/api/cliente.ts"]

  - id: vv-no-dangerously-set-inner-html
    message: >-
      dangerouslySetInnerHTML proibido (ADR-002, T3/T5). Texto de edital é exibido como texto.
    severity: ERROR
    languages: [generic]
    pattern-regex: dangerouslySetInnerHTML
    paths:
      include: [apps/web/]
      exclude: ["*.md"]

  - id: vv-no-float-em-rules
    message: >-
      float em rules/ (AGENTS.md §3.14). Dinheiro e quantidades usam decimal.Decimal.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: float(...)
      - pattern: "def $F(..., $P: float, ...): ..."
      - pattern: "def $F(...) -> float: ..."
      - pattern: "$X: float = $V"
    paths:
      include: [apps/worker/src/worker/rules/]

  - id: vv-parsefloat-dinheiro
    message: >-
      parseFloat/Number em valor monetário perde precisão (AGENTS.md §3.14). Valores chegam como string.
    severity: WARNING
    languages: [generic]
    pattern-regex: (?i)(parseFloat|Number)\(\s*[\w.]*(valor|preco|custo|margem|total|unitario)
    paths:
      include: [apps/web/, apps/api/]
      exclude: ["*.md"]

  - id: vv-rls-desligado
    message: >-
      RLS desligado ou policy using(true) (AGENTS.md §3.12). Toda tabela tem RLS e policy via
      core.has_permission.
    severity: ERROR
    languages: [generic]
    pattern-regex: (?i)(disable\s+row\s+level\s+security|using\s*\(\s*true\s*\))
    paths:
      include: [db/migrations/]

  - id: vv-sdk-llm-fora-de-llm
    message: >-
      SDK de LLM importado fora de worker/llm/ (ADR-005). Toda chamada de IA passa pela camada llm/
      para registrar modelo, prompt, custo e validar a saída.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: import openai
      - pattern: import anthropic
      - pattern: import litellm
      - pattern: from openai import $X
      - pattern: from anthropic import $X
      - pattern: from litellm import $X
      - pattern: from google import genai
    paths:
      include: [apps/worker/]
      exclude: [apps/worker/src/worker/llm/]

  - id: vv-sem-print-no-worker
    message: >-
      print() no worker vaza dados para o log sem redação. Use logging com extra={"ctx": ...}.
    severity: WARNING
    languages: [python]
    pattern: print(...)
    paths:
      include: [apps/worker/src/]
